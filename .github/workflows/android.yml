# Builds the Android app (APK) every time the files change.
# The newest APK is always at: https://github.com/<you>/<repo>/releases/latest/download/starman.apk
name: Build apps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: 1 Get files
        uses: actions/checkout@v5
      - name: 2 Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 3 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: 5 Prepare web files
        run: |
          set -ex
          VERSION=$(node -p "require('./version.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p build/www build/assets
          cp index.html build/www/
          cp manifest.webmanifest icon-192.png icon-512.png build/www/ || true
          cp icon-1024.png build/assets/icon-only.png || true
          cp icon-1024.png build/assets/icon-foreground.png || true
          cp icon-1024.png build/assets/icon-background.png || true
          cd build
          cat > package.json <<'EOF'
          { "name": "starman", "version": "1.0.0", "private": true }
          EOF
          cat > capacitor.config.json <<'EOF'
          { "appId": "com.starman.animations", "appName": "Starman Does Animations", "webDir": "www" }
          EOF
      - name: 6 Install Capacitor
        working-directory: build
        run: |
          set -ex
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
      - name: 7 Make Android project
        working-directory: build
        run: |
          set -ex
          npx cap add android
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          f = '''<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="content" />
                  <data android:scheme="file" />
                  <data android:mimeType="application/octet-stream" />
                  <data android:mimeType="application/json" />
                  <data android:mimeType="application/zip" />
                  <data android:mimeType="application/x-zip-compressed" />
                  <data android:mimeType="application/x-aseprite" />
                  <data android:mimeType="image/x-aseprite" />
                  <data android:mimeType="text/plain" />
              </intent-filter>
          '''
          i = s.index('</activity>')
          s = s[:i] + f + s[i:]
          open(p, 'w').write(s)
          print(s)
          PY
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
      - name: 8 App icon
        working-directory: build
        continue-on-error: true
        run: |
          npm install --no-audit --no-fund @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#1d1d36' --splashBackgroundColor '#1d1d36'
      - name: 9 Build APK
        working-directory: build/android
        run: |
          set -ex
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../starman.apk
      - name: 10 Keep APK (download from this page too)
        uses: actions/upload-artifact@v4
        with:
          name: starman-apk
          path: starman.apk

  windows:
    runs-on: windows-latest
    steps:
      - name: 1 Get files
        uses: actions/checkout@v5
      - name: 2 Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 3 Build the Windows program
        shell: bash
        run: |
          set -ex
          VERSION=$(node -p "require('./version.json').version")
          mkdir -p winapp && cp -r desktop/. winapp/ && cp index.html winapp/
          cp manifest.webmanifest icon-192.png icon-512.png winapp/ || true
          cd winapp
          cat > package.json <<EOF
          { "name": "starman-does-animations", "productName": "Starman Does Animations", "version": "$VERSION", "main": "main.js", "author": "Rember_Er", "description": "Starman Does Animations" }
          EOF
          npm install --no-audit --no-fund --save-dev electron@33.2.1 electron-builder@25.1.8
          cat > builder.json <<'EOF'
          { "appId": "com.starman.animations", "productName": "Starman Does Animations", "asar": false,
            "directories": { "output": "dist" },
            "files": ["**/*", "!dist/**", "!builder.json", "!node_modules/**"],
            "win": { "icon": "icon.ico", "target": ["nsis", "zip"] },
            "nsis": { "oneClick": false, "perMachine": false, "allowToChangeInstallationDirectory": true, "createDesktopShortcut": true, "shortcutName": "Starman Does Animations", "artifactName": "starman-setup.exe" },
            "zip": { "artifactName": "starman-windows.zip" } }
          EOF
          npx electron-builder --win --x64 --config builder.json --publish never
          cp dist/starman-setup.exe dist/starman-windows.zip ..
      - name: 4 Keep the Windows files
        uses: actions/upload-artifact@v4
        with:
          name: starman-windows
          path: |
            starman-setup.exe
            starman-windows.zip
  release:
    needs: [apk, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: 1 Get files
        uses: actions/checkout@v5
      - name: 2 Collect the built apps
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 3 Version
        run: echo "VERSION=$(node -p "require('./version.json').version")" >> $GITHUB_ENV
      - name: 4 Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Starman Does Animations ${{ env.VERSION }}
          body: |
            Android: install starman.apk on your phone (allow installing from this source when asked).
            Windows: run starman-setup.exe (if Windows warns, press "More info" → "Run anyway"), or unpack starman-windows.zip and start "Starman Does Animations.exe".
          files: |
            out/starman.apk
            out/starman-setup.exe
            out/starman-windows.zip
          make_latest: true
